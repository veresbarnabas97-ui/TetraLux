<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TetraLux (TLX) | Official Presale</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  
  <script src="https://unpkg.com/@solana/web3.js@1.88.0/lib/index.iife.min.js"></script>
  <script src="https://unpkg.com/@coral-xyz/anchor@0.29.0/dist/browser.anchor.min.js"></script>
  
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: white; }
    .font-rajdhani { font-family: 'Rajdhani', sans-serif; }
    .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
    .gradient-text { background: linear-gradient(135deg, #60a5fa, #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  </style>
</head>
<body class="min-h-screen">

  <nav class="fixed w-full z-50 glass">
    <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
      <div class="flex items-center space-x-2">
        <div class="w-10 h-10 bg-blue-600 rounded-lg flex items-center justify-center font-bold text-xl">T</div>
        <span class="text-2xl font-rajdhani font-bold tracking-wider">TETRALUX</span>
      </div>
      <button id="connect-wallet-btn" class="bg-blue-600 hover:bg-blue-700 px-6 py-2 rounded-full font-semibold transition-all flex items-center space-x-2">
        <i class="fas fa-wallet"></i>
        <span>Connect Wallet</span>
      </button>
    </div>
  </nav>

  <main class="pt-32 pb-20 px-6">
    <div class="max-w-4xl mx-auto text-center">
      <h1 class="text-5xl md:text-7xl font-rajdhani font-bold mb-6">
        <span class="gradient-text">TetraLux</span> Presale is Live
      </h1>
      <p class="text-slate-400 text-lg mb-12 max-w-2xl mx-auto">
        Join the ethical DeFi revolution on Solana. Secure your TLX tokens at the initial price of 1,000,000 TLX per 1 SOL.
      </p>

      <div class="glass p-8 rounded-3xl max-w-md mx-auto relative overflow-hidden">
        <div class="absolute top-0 right-0 p-3">
          <span class="flex h-3 w-3 relative">
            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
            <span class="relative inline-flex rounded-full h-3 w-3 bg-green-500"></span>
          </span>
        </div>

        <div class="mb-8">
          <label class="block text-left text-sm font-semibold text-slate-400 mb-2">Amount (SOL)</label>
          <div class="relative">
            <input id="buy-amount" type="number" step="0.1" value="0.1" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-4 text-xl focus:outline-none focus:border-blue-500 transition-colors">
            <span class="absolute right-4 top-4 font-bold text-slate-500">SOL</span>
          </div>
          <div class="text-left mt-2 text-sm text-blue-400">
            You will receive: <span id="receive-amount">100,000</span> TLX
          </div>
        </div>

        <button id="buy-btn" class="w-full bg-gradient-to-r from-blue-600 to-purple-600 py-4 rounded-xl font-bold text-lg hover:scale-[1.02] active:scale-[0.98] transition-all shadow-lg shadow-blue-900/20">
          Connect Wallet to Buy
        </button>
        
        <p class="mt-4 text-xs text-slate-500 italic">Min: 0.01 SOL | Max Cap: 40M TLX</p>
      </div>
    </div>
  </main>

  <script>
    // --- KONFIGURÁCIÓ ---
    // FONTOS: Ezeket frissítsd a Playground-os kimenet alapján!
    const CONFIG = {
      PROGRAM_ID: "Ch7TkVphDyToJtvAGXDvgt1zsiQg5zhhNNRm8PJdkiD4",
      PRESALE_STATE: "BhfjyG1bRUEeEBaVezWKgff7WLvmjG47QPAsZUT8okho", 
      RPC_URL: "https://api.devnet.solana.com", // Javasolt: QuickNode vagy Helius URL
      TOKEN_PRICE: 1000000 
    };

    const IDL = {
      "version": "0.1.0",
      "name": "tetralux_presale",
      "instructions": [
        {
          "name": "buyTokens",
          "accounts": [
            { "name": "buyer", "isMut": true, "isSigner": true },
            { "name": "admin", "isMut": true, "isSigner": false },
            { "name": "presaleState", "isMut": true, "isSigner": false },
            { "name": "vault", "isMut": true, "isSigner": false },
            { "name": "buyerTokenAccount", "isMut": true, "isSigner": false },
            { "name": "tokenMint", "isMut": false, "isSigner": false },
            { "name": "systemProgram", "isMut": false, "isSigner": false },
            { "name": "tokenProgram", "isMut": false, "isSigner": false }
          ],
          "args": [{ "name": "solAmount", "type": "u64" }]
        }
      ]
    };

    let walletConnected = false;
    const web3 = solanaWeb3;
    const anchorLib = anchor;

    // Kalkulátor frissítése
    document.getElementById('buy-amount').oninput = (e) => {
      const val = parseFloat(e.target.value) || 0;
      document.getElementById('receive-amount').innerText = (val * CONFIG.TOKEN_PRICE).toLocaleString();
    };

    async function handleConnect() {
      try {
        const resp = await window.solana.connect();
        walletConnected = true;
        document.getElementById('connect-wallet-btn').innerText = "Connected: " + resp.publicKey.toString().slice(0,4) + "...";
        document.getElementById('buy-btn').innerText = "Buy TLX Now";
        return resp.publicKey;
      } catch (err) {
        console.error("Connection error:", err);
        alert("Could not connect to Phantom!");
      }
    }

    document.getElementById('connect-wallet-btn').onclick = handleConnect;

    document.getElementById('buy-btn').onclick = async () => {
      // Automatikus csatlakozás ha még nem tette meg
      if (!walletConnected) {
        await handleConnect();
        return;
      }

      const amount = parseFloat(document.getElementById('buy-amount').value);
      if (isNaN(amount) || amount <= 0) return alert("Enter a valid amount!");

      const buyBtn = document.getElementById('buy-btn');
      buyBtn.disabled = true;
      buyBtn.innerText = "Processing...";

      try {
        const connection = new web3.Connection(CONFIG.RPC_URL, "confirmed");
        const provider = new anchorLib.AnchorProvider(connection, window.solana, { preflightCommitment: "confirmed" });
        const program = new anchorLib.Program(IDL, CONFIG.PROGRAM_ID, provider);

        const buyerPubkey = provider.wallet.publicKey;
        const presaleStatePubkey = new web3.PublicKey(CONFIG.PRESALE_STATE);

        // 1. Állapot lekérése (Vault és Admin címekhez)
        const state = await program.account.presaleState.fetch(presaleStatePubkey);
        
        // 2. Buyer token account meghatározása
        const buyerTokenAccount = await anchorLib.utils.token.associatedAddress({
          mint: state.tokenMint,
          owner: buyerPubkey
        });

        // 3. Tranzakció összeállítása
        // JAVÍTÁS: A sol_amount-ot Lamports-ban (10^9) kell küldeni!
        const lamports = new anchorLib.BN(amount * web3.LAMPORTS_PER_SOL);

        const tx = await program.methods
          .buyTokens(lamports)
          .accounts({
            buyer: buyerPubkey,
            admin: state.admin,
            presaleState: presaleStatePubkey,
            vault: state.vault,
            buyerTokenAccount: buyerTokenAccount,
            tokenMint: state.tokenMint,
            systemProgram: web3.SystemProgram.programId,
            tokenProgram: anchorLib.utils.token.TOKEN_PROGRAM_ID,
          })
          .rpc();

        alert("🎉 Success! Transaction: " + tx);
      } catch (err) {
        console.error("Transaction Error:", err);
        alert("Transaction failed! Check console for details.");
      } finally {
        buyBtn.disabled = false;
        buyBtn.innerText = "Buy TLX Now";
      }
    };
  </script>
</body>
</html>
